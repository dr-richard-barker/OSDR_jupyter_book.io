# Build the Jupyter Book and deploy it to GitHub Pages.
name: Build and deploy Jupyter Book

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The monthly FAIR snapshot commits with GITHUB_TOKEN, which never fires a
  # push event — so rebuild whenever that workflow finishes.
  workflow_run:
    workflows: ["Monthly FAIR snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chapters/requirements.txt

      # The book builds with execute_notebooks off, so re-run the one notebook
      # that only reads committed CSVs; its charts then cover every row of
      # fair_history.csv instead of whatever was saved at last local run.
      - name: Refresh the FAIR-over-time notebook
        run: jupyter nbconvert --to notebook --execute --inplace chapters/OSDR_fair_over_time.ipynb

      - name: Build the book
        run: jupyter-book build chapters/

      # The generated root index.html is a bare meta-refresh to intro.html that
      # drops the query string. Rewrite it to forward ?cose_scope=… (and hash)
      # so a scoped hub link (e.g. ?cose_scope=deepspaceag) reaches the book.
      - name: Preserve query string on root redirect
        run: |
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><title>Redirecting…</title>' \
            '<script>location.replace("intro.html"+location.search+location.hash)</script>' \
            '<noscript><meta http-equiv="refresh" content="0; url=intro.html"></noscript>' \
            > chapters/_build/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: chapters/_build/html

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
